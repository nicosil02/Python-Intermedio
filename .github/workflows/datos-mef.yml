name: datos-mef
on:
  push:
    branches: [datos-mef]
  workflow_dispatch:
jobs:
  gasto:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        anio: [2005, 2006, 2007, 2008, 2009, 2010, 2011]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pyarrow
      - run: sudo mkdir -p /mnt/mef && sudo chmod 777 /mnt/mef
      - run: python tarea_3/scripts/obtener_datos.py gasto /mnt/mef ${{ matrix.anio }}
      - uses: actions/upload-artifact@v4
        with:
          name: gasto-${{ matrix.anio }}
          path: tarea_3/datos/procesados/*_${{ matrix.anio }}.parquet
